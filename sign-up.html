<!doctype html>
<html lang="vi">
<!-- Head -->
<% const page = { title: "Đăng ký - Spotify clone" } %>
<%- include("./src/views/partials/head.ejs", { page }) %>

<body>
    <%- include("./src/views/pages/sign-up.ejs") %>

    <!-- Scripts -->
    <script type="module" src="./src/validator.js"></script>
    <script type="module">
        import {
            Validator
        } from "./src/validator";
        Validator({
            form: "#form-sign-up",
            formGroupSelector: ".form__group",
            messageSelector: ".form__message",
            rules: [
                Validator.isRequired("#email"),
                Validator.isEmail("#email"),
                Validator.isRequired("#password"),
                Validator.minLength("#password", 6),
                Validator.hasLowerCaseChar("#password"),
                Validator.hasUpperCaseChar("#password"),
                Validator.hasNumber("#password"),
            ],
            onSubmit(data) {
                console.log(data);
            },
        });
    </script>
</body>

</html>
